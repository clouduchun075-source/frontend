name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      # React Router uses client-side routing, but GitHub Pages has no
      # concept of "serve index.html for any path" -- the standard fix is
      # to also serve index.html as the 404 page, so a direct link to e.g.
      # /profile or a page refresh still boots the app instead of showing
      # GitHub's real 404 page.
      - name: SPA fallback (404 = index)
        run: cp dist/index.html dist/404.html

      # Pins the custom domain so GitHub Pages doesn't forget it on
      # every fresh deploy (Pages settings alone can get reset by this).
      - name: Add CNAME for custom domain
        run: echo "sayway.uz" > dist/CNAME

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
